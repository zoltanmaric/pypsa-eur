name: Security scan
on:
  push:
    branches: [master]
    paths: [pixi.lock]
  # No path filter, a required check must report on every PR
  pull_request:
  schedule:
  - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  changes:
    name: Detect pixi.lock changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      scan: ${{ steps.diff.outputs.scan }}
    steps:
    - id: diff
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
        grep -Eq '^(pixi[.]lock|[.]github/workflows/security-scan[.]yaml)$' <<< "$files" && scan=true || scan=false
        echo "scan=$scan" >> "$GITHUB_OUTPUT"

  scan:
    name: SBOM and vulnerability scan
    needs: changes
    # Scan dependency and scanner changes; unchanged dependencies need no PR scan.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.scan == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: write   # required by anchore/sbom-action dependency-snapshot upload
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v7
    - uses: prefix-dev/setup-pixi@v0.10.2

    - name: Generate SBOM
      uses: anchore/sbom-action@v0.24.2
      with:
        path: ".pixi/envs/default"
        output-file: sbom.spdx.json
        dependency-snapshot: ${{ github.ref == 'refs/heads/master' }}
        upload-artifact: false  # uploaded explicitly below, master only

    - name: Vulnerability Scan
      id: scan
      uses: anchore/scan-action@v7.4.2
      env:
        SBOM: sbom.spdx.json
      with: &scan_settings
        sbom: ${{ env.SBOM }}
        fail-build: false
        severity-cutoff: high
        add-cpes-if-none: true
        by-cve: true
        output-format: sarif

    # Set uri=pixi.lock for a readable location, and fingerprint each alert by
    # CVE id so code scanning matches against the master baseline by CVE, not line.
    - name: Normalize SARIF (pixi.lock location + CVE fingerprint)
      run: |
        jq '.runs[].results[] |= (
              .locations[].physicalLocation.artifactLocation.uri = "pixi.lock"
              | .partialFingerprints = {"grypeCve/v1": .ruleId}
            )' "${{ steps.scan.outputs.sarif }}" > normalized.sarif
        mv normalized.sarif "${{ steps.scan.outputs.sarif }}"

    - name: Upload SARIF
      if: github.ref == 'refs/heads/master'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: pixi-vuln-scan

    # Retain master SBOMs for audit; PR comparisons build their own exact-base SBOM.
    - name: Upload SBOM as artifact
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v7
      with:
        name: master-sbom
        path: sbom.spdx.json
        retention-days: 30

    # Use the event's exact base, not an artifact from a different branch or commit.
    - name: Check out PR baseline
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .security-baseline
        persist-credentials: false

    - name: Install PR baseline
      if: github.event_name == 'pull_request'
      run: pixi install --manifest-path .security-baseline/pixi.toml --locked

    - name: Generate PR baseline SBOM
      if: github.event_name == 'pull_request'
      uses: anchore/sbom-action@v0.24.2
      with:
        path: .security-baseline/.pixi/envs/default
        output-file: base-sbom.spdx.json
        dependency-snapshot: false
        upload-artifact: false

    - name: Scan PR baseline
      id: baseline
      if: github.event_name == 'pull_request'
      uses: anchore/scan-action@v7.4.2
      env:
        SBOM: base-sbom.spdx.json
      with: *scan_settings

    - name: Fail on new CVEs
      if: github.event_name == 'pull_request'
      env:
        PR_SARIF: ${{ steps.scan.outputs.sarif }}
        BASE_SARIF: ${{ steps.baseline.outputs.sarif }}
      run: |
        [ -s "$BASE_SARIF" ] || { echo "::error::baseline SARIF missing"; exit 2; }
        [ -s "$PR_SARIF" ]   || { echo "::error::PR SARIF missing"; exit 2; }
        ids() { jq -r '.runs[].results[] | select(.level == "error") | .ruleId' "$1" | sort -u; }
        new=$(comm -23 <(ids "$PR_SARIF") <(ids "$BASE_SARIF"))
        if [ -n "$new" ]; then
          echo "::error::New high+ CVEs vs PR base:"
          printf '%s\n' "$new"
          exit 1
        fi
        echo "No new high+ CVEs vs PR base."
